<style>
:root{
  --bg:#f3f2f2; --ink:#201e1d; --ink-2:#3d3937; --ink-3:#4a4644;
  --mut:#7d7979; --mut-2:#8a8583; --mut-3:#9b9797; --line:rgba(32,30,29,.14);
  --accent:#0088b0; --accent-700:#004961; --accent-100:#e9f8ff; --accent-2:#d6006c; --accent-2-100:#ffe7f1;
  --ts:1; --ff:'Source Serif 4',Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{font-family:var(--ff);color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{height:100dvh;height:100vh;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:0 22px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;font-size:10px;line-height:1.4;color:var(--mut-3)}
.dateline{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--mut-2)}
.src{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.5;color:var(--mut-2);letter-spacing:.03em}
.top{padding-top:calc(env(safe-area-inset-top) + 26px)}
h1{font-size:calc(40px * var(--ts));line-height:1.05;font-weight:600;letter-spacing:-.018em;margin:28px 0 0;text-wrap:pretty}
h2{font-size:calc(31px * var(--ts));line-height:1.1;font-weight:600;margin:10px 0 0;text-wrap:pretty}
.lede{margin:14px 0 0;font-size:calc(16px * var(--ts));line-height:1.5;color:var(--ink-3);max-width:24em}
.rule{height:2px;background:var(--ink);margin-top:10px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;min-height:44px}
input{font:inherit;color:inherit;min-height:44px;-webkit-appearance:none;border:0;background:none;border-bottom:1px solid rgba(32,30,29,.3);padding:8px 0;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{min-height:44px;padding:0 18px;border-radius:2px;font-size:calc(14px * var(--ts))}
.btn-p{background:var(--accent);color:var(--bg);font-weight:600}
.btn-p:active{background:#00779a}
.btn-o{border:1px solid rgba(32,30,29,.18)}
.btn-o:active{background:rgba(32,30,29,.06)}
.link{color:var(--accent-700);text-align:left;padding:0;font-size:calc(16px * var(--ts))}
.row{position:relative;overflow:hidden}
.row .face{position:relative;background:var(--bg);display:flex;gap:14px;align-items:flex-start;padding:19px 22px;touch-action:pan-y}
.row .under{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:var(--accent-100)}
.row .under .l{color:#003d52}
.row .under .r{color:#8a0045}
.time{flex:none;width:52px;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.4;color:var(--mut);padding-top:4px}
.ttl{font-size:calc(17px * var(--ts));line-height:1.3;font-weight:600}
.mark{flex:none;margin-top:3px;width:24px;height:24px;min-height:24px;border-radius:50%;border:1.5px solid rgba(32,30,29,.28)}
.mark.on{background:var(--accent);border-color:var(--accent)}
.chip{border:1px solid rgba(32,30,29,.2);border-radius:2px;padding:0 14px;min-height:44px;font-size:calc(14px * var(--ts))}
.chip.on{border-color:var(--accent);background:var(--accent-100);color:var(--accent-700)}
.tabs{display:flex;justify-content:space-between;padding:8px 22px calc(env(safe-area-inset-bottom) + 10px);background:var(--bg)}
.tabs button{font-size:calc(14px * var(--ts));font-weight:600;padding:0 6px;color:var(--mut-2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.quote{margin:12px 0 0;font-size:calc(15px * var(--ts));line-height:1.55;font-style:italic;border-left:2px solid var(--accent);padding-left:15px}
.part{display:flex;align-items:baseline;gap:10px}
.part i{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.12em;color:var(--accent);font-style:normal}
.part s{flex:1;height:1px;background:var(--line);text-decoration:none}
.sw{flex:none;width:51px;height:31px;border-radius:16px;padding:3px;display:flex;align-items:center;justify-content:flex-start;background:#bab6b6}
.sw.on{justify-content:flex-end;background:var(--accent)}
.sw span{width:25px;height:25px;border-radius:50%;background:var(--bg);display:block;box-shadow:0 1px 2px rgba(32,30,29,.25)}
.opt{text-align:left;display:flex;gap:13px;align-items:flex-start;padding:12px 4px;width:100%}
.dot{width:15px;height:15px;border-radius:50%;flex:none;margin-top:4px;border:1.5px solid rgba(32,30,29,.3)}
.dot.on{background:var(--accent);box-shadow:inset 0 0 0 3.5px var(--bg)}
.sheet-bd{position:fixed;inset:0;z-index:80;background:rgba(45,43,43,.42);display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--bg);border-radius:4px 4px 0 0;padding:20px 22px calc(env(safe-area-inset-bottom) + 22px)}
.sheet button{display:block;width:100%;text-align:left;font-size:calc(17px * var(--ts));padding:14px 4px;border-top:1px solid rgba(32,30,29,.1)}
.flash{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:90;display:flex;justify-content:center;pointer-events:none}
.flash span{background:var(--ink);color:var(--bg);font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:11px 16px;border-radius:2px;animation:bf .18s ease}
@keyframes bf{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
a{color:var(--accent-700);text-decoration:none}
a:hover{color:var(--accent)}
::selection{background:var(--accent-100)}

/* ---- desktop / laptop ---- */
@media (min-width:900px){
  body{background:#e6e4e4}
  #app{height:100dvh;max-width:1080px;margin:0 auto;flex-direction:row;background:var(--bg)}
  .scroll{order:2;min-width:0}
  .tabs{order:1;flex:none;width:250px;flex-direction:column;justify-content:flex-start;gap:2px;padding:46px 26px 26px 40px;border-right:1px solid var(--line)}
  .tabs::before{content:'Daily Brief';font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;font-size:10px;color:var(--mut-3);padding-left:13px;margin-bottom:26px}
  .tabs button{text-align:left;padding:11px 0 11px 13px;font-size:calc(15px * var(--ts));border-bottom:0;border-left:2px solid transparent}
  .tabs button.on{border-bottom-color:transparent;border-left-color:var(--accent)}
  .pad{padding:0 56px}
  .top{padding-top:48px}
  h1{font-size:calc(54px * var(--ts))}
  h2{font-size:calc(38px * var(--ts))}
  .lede{font-size:calc(17px * var(--ts));max-width:30em}
  .row .face{padding:21px 56px}
  .row .under{padding:0 56px}
  .time{width:62px}
  .ttl{font-size:calc(18px * var(--ts))}
  .pad input,.pad textarea{max-width:560px}
  .pad>button.btn,.pad button[data-build]{max-width:360px}
  .sheet-bd{align-items:center;justify-content:center}
  .sheet{max-width:430px;border-radius:3px;padding:24px 26px}
  .flash{bottom:34px}
}
@media (hover:hover){
  .btn-p:hover{background:#00779a}
  .btn-o:hover{background:rgba(32,30,29,.05)}
  .chip:hover{border-color:var(--accent);color:var(--accent-700)}
  .tabs button:hover{color:var(--ink)}
  .mark:hover{border-color:var(--accent)}
  .link:hover{color:var(--accent)}
  .row .face:hover{background:#efeded}
  .sheet button:hover{background:rgba(32,30,29,.04)}
}
</style>
</head>

  var PROVIDER_IDS = ['gemini', 'anthropic'];
  function prov() { return PROVIDERS[S.provider] || PROVIDERS.gemini; }
  function llmName() { return prov().name; }

  var S = {
    screen: 'onboard', step: 1, model: 'swipe', project: 'p1',
    provider: 'gemini', apiKey: '', keys: {}, llm: 'gemini-2.5-flash', notes: '', linked: false, lastRead: '',

  function clone(list) {

  /* ---------- OneDrive: read a shared folder, no app registration ----------

  /* ---------- Model API (direct from the browser, user's own key) ---------- */

  function callClaude(system, user, maxTokens, onDone, onFail) {
    var p = prov(), url, body, xhr = new XMLHttpRequest();
    if (p.id === 'gemini') {
      url = 'https://generativelanguage.googleapis.com/v1beta/models/' +
        encodeURIComponent(S.llm) + ':generateContent?key=' + encodeURIComponent(S.apiKey);
      body = {
        systemInstruction: { parts: [{ text: system }] },
        contents: [{ role: 'user', parts: [{ text: user }] }],
        generationConfig: { maxOutputTokens: maxTokens * 2, temperature: 0.2 }
      };
      if (S.llm.indexOf('2.5-flash') > -1) body.generationConfig.thinkingConfig = { thinkingBudget: 0 };
    } else {
      url = 'https://api.anthropic.com/v1/messages';
      body = { model: S.llm, max_tokens: maxTokens, system: system, messages: [{ role: 'user', content: user }] };
    }
    xhr.open('POST', url, true);
    xhr.setRequestHeader('content-type', 'application/json');
    if (p.id === 'anthropic') {
      xhr.setRequestHeader('x-api-key', S.apiKey);
      xhr.setRequestHeader('anthropic-version', '2023-06-01');
      xhr.setRequestHeader('anthropic-dangerous-direct-browser-access', 'true');
    }
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      var data = null, text = '', i, parts;
      try { data = JSON.parse(xhr.responseText); } catch (e) { data = null; }
      if (xhr.status === 200 && data) {
        if (p.id === 'gemini') {
          parts = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
          if (parts) { for (i = 0; i < parts.length; i++) { if (parts[i].text) text += parts[i].text; } }
        } else if (data.content) {
          for (i = 0; i < data.content.length; i++) {
            if (data.content[i].type === 'text') text += data.content[i].text;
          }
        }
      }
      if (text) { onDone(text); return; }
      var msg = 'Request failed (' + xhr.status + ')';
      if (data && data.error && data.error.message) msg = data.error.message;
      else if (!xhr.status) msg = 'No connection to ' + p.host;
      else if (xhr.status === 200) msg = p.name + ' returned an empty answer. Try again.';
      onFail(msg);
    };
    xhr.send(JSON.stringify(body));
  }

  function jsonFrom(text) {
    var a = text.indexOf('['), b = text.lastIndexOf(']');

  var EXTRACT = 'You turn a person\u2019s work notes into a short morning brief. ' +

    'Order by time. Never invent commitments that are not in the notes. Quote, do not paraphrase, the quote field.';

  function buildBrief() {
    var key = (S.keyDraft || S.apiKey || '').replace(/^\s+|\s+$/g, '');
    if (!key) { S.error = 'Paste your API key first.'; render(); return; }
    S.apiKey = key; if (!S.keys) S.keys = {}; S.keys[S.provider] = key;
    S.error = ''; S.busy = true; S.status = ''; render();
    if (S.source === 'onedrive') {

  function extract(notes) {
    callClaude(EXTRACT, 'Today is Wednesday 16 September 2026. My notes:\n\n' + notes, 2000, function (text) {
      var list = jsonFrom(text), i, o, parts, min, sched = [], loose = [];

        parts = String(o.time || '09:00').split(':');

  function sheet() {
    var r = find(S.sheetId);
    if (!r) return '';

      '<div class="mono">' + fmt(r.min) + '</div>' +

  /* ---------- render ---------- */

  var app = document.getElementById('app');

  function render() {
    var el = app.querySelector('.scroll');
    if (el) S.scroll[S.screen] = el.scrollTop;
    document.documentElement.style.setProperty('--ff', S.font);
    document.documentElement.style.setProperty('--ts', String(S.ts));
    var body;
    switch (S.screen) {
      case 'onboard': body = onboard(); break;
      case 'link': body = link(); break;
      case 'detail': body = detail(); break;
      case 'create': body = create(); break;
      case 'ask': body = askScreen(); break;
      case 'review': body = review(); break;
      case 'settings': body = settings(); break;
      case 'lock': body = lock(); break;
      default: body = today();
    }
    app.innerHTML = body + sheet() + (S.flash ? '<div class="flash"><span>' + esc(S.flash) + '</span></div>' : '');
    var sc = app.querySelector('.scroll');
    if (sc && S.scroll[S.screen]) sc.scrollTop = S.scroll[S.screen];
    save();
  }

  /* ---------- events ---------- */

  function attr(node, name) {
    while (node && node !== app) {
      if (node.getAttribute) {
        var v = node.getAttribute(name);
        if (v !== null) return v;
      }
      node = node.parentNode;
    }
    return null;
  }

  var moved = false, holdTimer = null;

  app.addEventListener('click', function (e) {
    var t = e.target, v;
    if (moved) { moved = false; return; }

    if ((v = attr(t, 'data-go'))) { go(v); return; }
    if (attr(t, 'data-step')) {
      if (S.step === 3) { S.step = 1; go('link'); } else { S.step++; render(); }
      return;
    }
    if ((v = attr(t, 'data-project'))) { S.project = v; render(); return; }
    if ((v = attr(t, 'data-provider'))) {
      if (!S.keys) S.keys = {};
      if (S.keyDraft) S.keys[S.provider] = S.keyDraft;
      S.provider = v;
      S.llm = PROVIDERS[v].models[0];
      S.keyDraft = S.keys[v] || '';
      S.apiKey = S.keyDraft;
      S.error = ''; render(); return;
    }
    if ((v = attr(t, 'data-llm'))) { S.llm = v; render(); return; }
    if ((v = attr(t, 'data-source'))) { S.source = v; S.error = ''; render(); return; }
    if (attr(t, 'data-refresh')) { S.screen = 'link'; buildBrief(); return; }
    if (attr(t, 'data-build')) { buildBrief(); return; }
    if (attr(t, 'data-unlink')) {
      S.linked = false; S.notes = ''; S.notesDraft = ''; S.asked = []; S.files = [];
      S.folderUrl = ''; S.folderDraft = '';
      S.reminders = clone(SEED); S.suggestions = SUGG.slice();
      flash('Disconnected'); go('link'); return;
    }
    if ((v = attr(t, 'data-open'))) { S.openId = Number(v); go('detail'); return; }
    if ((v = attr(t, 'data-done'))) { complete(Number(v)); return; }
    if ((v = attr(t, 'data-check'))) {
      var rr = find(Number(v));
      if (rr.done) reopen(rr.id); else complete(rr.id);
      return;
    }
    if ((v = attr(t, 'data-accept'))) {
      var id = Number(v), i, s = null, keep = [];
      for (i = 0; i < S.suggestions.length; i++) {
        if (S.suggestions[i].id === id) s = S.suggestions[i]; else keep.push(S.suggestions[i]);
      }
      S.suggestions = keep;
      S.reminders.push({ id: id, min: s.min, title: s.title, source: 'Q4 Platform Rewrite \u00b7 ' + s.source, note: 'Added from the project this morning.', quote: '"' + s.title + '"', done: false, snoozed: false });
      flash('Scheduled ' + fmt(s.min));
      return;
    }
    if ((v = attr(t, 'data-detail'))) {
      var d = find(S.openId) || firstItem();
      if (v === 'done') { complete(d.id); go('today'); }
      else if (v === 'snooze') { snooze(d.id, 60); go('today'); }
      else if (v === 'evening') { snooze(d.id, 300); go('today'); }
      else { S.screen = 'ask'; ask(ANSWERS[0].q); }
      return;
    }
    if ((v = attr(t, 'data-time'))) { S.draftMin = Number(v); render(); return; }
    if ((v = attr(t, 'data-repeat'))) { S.repeat = v; render(); return; }
    if (attr(t, 'data-ctx')) { S.ctx = !S.ctx; render(); return; }
    if (attr(t, 'data-save')) {
      var title = (S.draftTitle || '').replace(/^\s+|\s+$/g, '');
      if (!title) { flash('Needs a line of text'); return; }
      S.reminders.push({
        id: Date.now(), min: S.draftMin, title: title,
        source: S.ctx ? projectName() + ' \u00b7 quoted context' : 'Added by you',
        note: S.repeat === 'once' ? 'One-off.' : 'Repeats ' + S.repeat + '.',
        quote: S.ctx ? '"' + title + '"' : '', done: false, snoozed: false
      });
      S.draftTitle = ''; S.screen = 'today'; flash('Added'); return;
    }
    if ((v = attr(t, 'data-ask'))) { ask(ANSWERS[Number(v)].q); return; }
    if (attr(t, 'data-send')) {
      var q = (S.chatDraft || '').replace(/^\s+|\s+$/g, '');
      if (q) ask(q);
      return;
    }
    if ((v = attr(t, 'data-font'))) { S.font = FONTS[Number(v)].stack; render(); return; }
    if ((v = attr(t, 'data-size'))) { S.ts = Number(v); render(); return; }
    if ((v = attr(t, 'data-voice'))) { S.voice = v; render(); return; }
    if ((v = attr(t, 'data-model'))) { S.model = v; render(); return; }
    if ((v = attr(t, 'data-notif'))) { S.notif[v] = !S.notif[v]; render(); return; }
    if (attr(t, 'data-restart')) { S.step = 1; go('onboard'); return; }
    if (attr(t, 'data-reset')) {
      S.reminders = clone(SEED); S.suggestions = SUGG.slice(); S.asked = [];
      flash('Sample day reset'); return;
    }
    if (attr(t, 'data-later')) { flash('Waiting until 17:30'); return; }
    if ((v = attr(t, 'data-sheet'))) {
      var sr = find(S.sheetId);
      if (v === 'done' || v === 'drop') { complete(sr.id); if (v === 'drop') flash('Dropped for today'); }
      else if (v === 'snooze') snooze(sr.id, 60);
      else if (v === 'evening') snooze(sr.id, 300);
      else { S.openId = sr.id; go('detail'); }
      return;
    }
    if (attr(t, 'data-closesheet')) { S.sheetId = null; render(); return; }
    if ((v = attr(t, 'data-row'))) { S.openId = Number(v); go('detail'); return; }
  }, false);

  app.addEventListener('input', function (e) {
    if (e.target.id === 'draft') S.draftTitle = e.target.value;
    if (e.target.id === 'chat') S.chatDraft = e.target.value;
    if (e.target.id === 'key') S.keyDraft = e.target.value;
    if (e.target.id === 'notes') S.notesDraft = e.target.value;
    if (e.target.id === 'folder') S.folderDraft = e.target.value;
  }, false);

  app.addEventListener('keydown', function (e) {
    if (e.target.id === 'chat' && e.keyCode === 13) {
      var q = (S.chatDraft || '').replace(/^\s+|\s+$/g, '');
      if (q) ask(q);
    }
  }, false);

  /* touch: swipe to clear / press-and-hold, with mouse fallback */
  function startDrag(face, id, x0) {
    if (S.model === 'hold') {
      if (holdTimer) window.clearTimeout(holdTimer);
      holdTimer = window.setTimeout(function () { moved = true; S.sheetId = id; render(); }, 380);
      return null;
    }
    if (S.model !== 'swipe') return null;
    face.style.transition = 'none';
    return { face: face, id: id, x0: x0, dx: 0 };
  }
  function moveDrag(d, x) {
    if (!d) return;
    d.dx = x - d.x0;
    if (Math.abs(d.dx) > 4) moved = true;
    d.face.style.transform = 'translateX(' + d.dx + 'px)';
  }
  function endDrag(d) {
    if (holdTimer) { window.clearTimeout(holdTimer); holdTimer = null; }
    if (!d) return;
    d.face.style.transition = 'transform .2s ease';
    d.face.style.transform = 'translateX(0px)';
    if (d.dx > 72) complete(d.id);
    else if (d.dx < -72) snooze(d.id, 60);
  }

  var drag = null;
  app.addEventListener('touchstart', function (e) {
    var face = e.target, id;
    while (face && face !== app && !(face.className && String(face.className).indexOf('face') > -1)) face = face.parentNode;
    if (!face || face === app) return;
    id = Number(face.getAttribute('data-row'));
    drag = startDrag(face, id, e.touches[0].clientX);
  }, false);
  app.addEventListener('touchmove', function (e) {
    if (drag) { moveDrag(drag, e.touches[0].clientX); }
    else if (holdTimer) { window.clearTimeout(holdTimer); holdTimer = null; }
  }, false);
  app.addEventListener('touchend', function () { endDrag(drag); drag = null; }, false);
  app.addEventListener('mousedown', function (e) {
    var face = e.target;
    while (face && face !== app && !(face.className && String(face.className).indexOf('face') > -1)) face = face.parentNode;
    if (!face || face === app) return;
    drag = startDrag(face, Number(face.getAttribute('data-row')), e.clientX);
    function mm(ev) { moveDrag(drag, ev.clientX); }
    function mu() {
      document.removeEventListener('mousemove', mm, false);
      document.removeEventListener('mouseup', mu, false);
      endDrag(drag); drag = null;
    }
    document.addEventListener('mousemove', mm, false);
    document.addEventListener('mouseup', mu, false);
  }, false);

  load();
  if (!S.reminders) S.reminders = clone(SEED);
  if (!S.suggestions) S.suggestions = SUGG.slice();
  render();
})();

</script>
</body>
</html>
